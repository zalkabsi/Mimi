<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Mimi: every vulnerability report gets a verdict with receipts</title>
  <desc id="desc">A dark, editorial-style illustration of a vulnerability report inbox and evidence dossier.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111e"/>
      <stop offset="1" stop-color="#10253a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity=".03"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1000" cy="90" r="300" fill="#0ea5e9" opacity=".07"/>
  <circle cx="1060" cy="570" r="260" fill="#6366f1" opacity=".08"/>
  <rect x="48" y="48" width="1104" height="534" rx="24" fill="url(#glow)" stroke="#29445a"/>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="94" y="119" fill="#7dd3fc" font-size="17" font-weight="700" letter-spacing="4">OPEN-SOURCE SECURITY TRIAGE</text>
    <text x="88" y="230" fill="#f1f5f9" font-size="94" font-weight="800" letter-spacing="-5">Mimi</text>
    <text x="94" y="281" fill="#cbd5e1" font-size="29" font-weight="500">Every vulnerability report gets</text>
    <text x="94" y="321" fill="#cbd5e1" font-size="29" font-weight="500">a verdict with receipts.</text>
    <text x="94" y="389" fill="#94a3b8" font-size="18">Evidence dossier · Test coverage · Human review</text>
  </g>

  <g transform="translate(655 116)">
    <rect width="418" height="374" rx="15" fill="#081522" stroke="#34506a"/>
    <path d="M0 52h418" stroke="#263d52"/>
    <circle cx="24" cy="25" r="5" fill="#38bdf8"/>
    <text x="42" y="31" fill="#dbeafe" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1">EVIDENCE DOSSIER</text>
    <rect x="25" y="73" width="132" height="25" rx="12" fill="#713f12" stroke="#f59e0b" stroke-opacity=".5"/>
    <text x="40" y="90" fill="#fde68a" font-family="ui-monospace, monospace" font-size="11">FIXTURE · REPLAY</text>
    <text x="25" y="137" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="20" font-weight="700">lodash@4.17.19</text>
    <text x="25" y="164" fill="#94a3b8" font-family="ui-sans-serif, system-ui" font-size="14">Prototype pollution claim</text>
    <rect x="25" y="187" width="368" height="1" fill="#263d52"/>
    <g font-family="ui-monospace, monospace" font-size="12">
      <circle cx="33" cy="218" r="5" fill="#38bdf8"/><text x="49" y="222" fill="#cbd5e1">Claim grounded against package source</text>
      <circle cx="33" cy="252" r="5" fill="#38bdf8"/><text x="49" y="256" fill="#cbd5e1">Public advisory references recorded</text>
      <circle cx="33" cy="286" r="5" fill="#a78bfa"/><text x="49" y="290" fill="#cbd5e1">2 declared hypotheses · coverage shown</text>
      <circle cx="33" cy="320" r="5" fill="#fbbf24"/><text x="49" y="324" fill="#cbd5e1">Human review remains in the loop</text>
    </g>
    <rect x="25" y="343" width="368" height="1" fill="#263d52"/>
    <text x="25" y="365" fill="#64748b" font-family="ui-sans-serif, system-ui" font-size="11">Illustrative thumbnail · sample data is not a live run</text>
  </g>

  <text x="94" y="540" fill="#64748b" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1">NEBIUS TOKEN FACTORY · NVIDIA NEMOTRON · TAVILY</text>
</svg>
