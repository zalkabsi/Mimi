# Live judge service. Provider secrets are entered in Render, never in Git.
services:
  - type: web
    name: mimi-judge
    runtime: docker
    plan: free
    region: frankfurt
    branch: master
    dockerfilePath: ./Dockerfile.judge
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    numInstances: 1
    maxShutdownDelaySeconds: 300
    envVars:
      - key: PORT
        value: "8000"
      - key: MIMI_JUDGE_KEY
        generateValue: true
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_PROJECT_ID
        sync: false
      - key: TAVILY_API_KEY
        sync: false
